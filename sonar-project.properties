# Project identification
sonar.projectKey=clemoudo_lighthouse
sonar.organization=clemoudo
sonar.projectName=Lighthouse
sonar.host.url=https://sonarcloud.io

# Source paths
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.py
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/.turbo/**,packages/eslint-config/**,packages/prettier-config/**,packages/typescript-config/**,**/pnpm-lock.yaml

# TypeScript / JavaScript Configuration
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,packages/logger/coverage/lcov.info

# Python Configuration (for your future AI service)
sonar.python.coverage.reportPaths=apps/ai/coverage.xml
