# Project identification (REPLACE with your SonarCloud values)
sonar.projectKey=clemoudo_lighthouse
sonar.organization=clemoudo
sonar.projectName=Lighthouse
sonar.host.url=https://sonarcloud.io

# Define Modules
sonar.modules=api,web,ui,logger

# Global Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/.turbo/**,packages/eslint-config/**,packages/prettier-config/**,packages/typescript-config/**,**/pnpm-lock.yaml

# Configuration for API module
api.sonar.projectName=API Gateway
api.sonar.projectBaseDir=apps/api
api.sonar.sources=src
api.sonar.tests=src/__tests__
api.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Configuration for Web module
web.sonar.projectName=Web Frontend
web.sonar.projectBaseDir=apps/web
web.sonar.sources=src
web.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Configuration for UI module
ui.sonar.projectName=Shared UI
ui.sonar.projectBaseDir=packages/ui
ui.sonar.sources=src

# Configuration for Logger module
logger.sonar.projectName=Shared Logger
logger.sonar.projectBaseDir=packages/logger
logger.sonar.sources=src
logger.sonar.tests=src/__tests__
logger.sonar.javascript.lcov.reportPaths=coverage/lcov.info

