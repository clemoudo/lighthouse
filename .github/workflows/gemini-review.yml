name: "🔎 Gemini Review"

on:
  pull_request:
    types:
      - "opened"
  pull_request_review_comment:
    types:
      - "created"
  pull_request_review:
    types:
      - "submitted"

concurrency:
  group: "${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}"
  cancel-in-progress: true

defaults:
  run:
    shell: "bash"

jobs:
  review:
    # Trigger conditions from the original dispatcher:
    # 1. PR opened (not from a fork)
    # 2. Comment/Review starting with @gemini-cli (from OWNER/MEMBER/COLLABORATOR)
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      ) || (
        github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body || github.event.review.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
      )
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      id-token: "write"
      issues: "write"
      pull-requests: "write"
    steps:
      - name: "Mint identity token"
        id: "mint_identity_token"
        if: |-
          ${{ vars.APP_ID }}
        uses: "actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf" # ratchet:actions/create-github-app-token@v2
        with:
          app-id: "${{ vars.APP_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"
          permission-contents: "read"
          permission-issues: "write"
          permission-pull-requests: "write"

      - name: "Extract command context"
        id: "extract"
        uses: "actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea" # ratchet:actions/github-script@v7
        env:
          REQUEST: "${{ github.event.comment.body || github.event.review.body }}"
        with:
          script: |
            const request = process.env.REQUEST || '';
            let additionalContext = '';
            
            if (request.startsWith("@gemini-cli /review")) {
              additionalContext = request.replace(/^@gemini-cli \/review/, '').trim();
            } else if (request.startsWith("@gemini-cli")) {
              additionalContext = request.replace(/^@gemini-cli/, '').trim();
            }
            core.setOutput('additional_context', additionalContext);

      - name: "Acknowledge request"
        if: |-
          github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
          ISSUE_NUMBER: "${{ github.event.pull_request.number }}"
          REPOSITORY: "${{ github.repository }}"
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "🤖 Hi @${{ github.actor }}, I've received your request for a code review, and I'm working on it now! You can track my progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            --repo "${REPOSITORY}"

      - name: "Checkout repository"
        uses: "actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8" # ratchet:actions/checkout@v6

      - name: "Run Gemini pull request review"
        uses: "google-github-actions/run-gemini-cli@v0" # ratchet:exclude
        id: "gemini_pr_review"
        env:
          GITHUB_TOKEN: "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
          GEMINI_CLI_TRUST_WORKSPACE: true
          ISSUE_TITLE: "${{ github.event.pull_request.title || github.event.issue.title }}"
          ISSUE_BODY: "${{ github.event.pull_request.body || github.event.issue.body }}"
          PULL_REQUEST_NUMBER: "${{ github.event.pull_request.number || github.event.issue.number }}"
          REPOSITORY: "${{ github.repository }}"
          ADDITIONAL_CONTEXT: "${{ steps.extract.outputs.additional_context }}"
        with:
          gcp_location: "${{ vars.GOOGLE_CLOUD_LOCATION }}"
          gcp_project_id: "${{ vars.GOOGLE_CLOUD_PROJECT }}"
          gcp_service_account: "${{ vars.SERVICE_ACCOUNT_EMAIL }}"
          gcp_workload_identity_provider: "${{ vars.GCP_WIF_PROVIDER }}"
          gemini_api_key: "${{ secrets.GEMINI_API_KEY }}"
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION }}"
          gemini_debug: "${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}"
          gemini_model: "${{ vars.GEMINI_MODEL }}"
          google_api_key: "${{ secrets.GOOGLE_API_KEY }}"
          use_gemini_code_assist: "${{ vars.GOOGLE_GENAI_USE_GCA }}"
          use_vertex_ai: "${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}"
          upload_artifacts: "${{ vars.UPLOAD_ARTIFACTS }}"
          workflow_name: "gemini-review"
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)"
                ]
              }
            }
          prompt: "/gemini-review"

      - name: "Send failure comment"
        if: |-
          failure()
        env:
          GITHUB_TOKEN: "${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}"
          ISSUE_NUMBER: "${{ github.event.pull_request.number }}"
          REPOSITORY: "${{ github.repository }}"
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "🤖 I'm sorry @${{ github.actor }}, but I was unable to process your request. Please [see the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details." \
            --repo "${REPOSITORY}"
