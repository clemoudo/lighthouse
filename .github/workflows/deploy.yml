name: Deploy to Production

on:
  release:
    types: [published]

# Prevent concurrent deployments to avoid Ansible/Docker conflicts
concurrency:
  group: deployment-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Fetch secrets dynamically via Infisical Action
      - name: Fetch Infisical Secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID_PIPELINE }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET_PIPELINE }}
          env-slug: "prod"
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          domain: "https://eu.infisical.com"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase image names
        run: |
          echo "IMAGE_NAME_WEB=$(echo ${{ env.IMAGE_BASE_NAME }}-web | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_API=$(echo ${{ env.IMAGE_BASE_NAME }}-api | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Web
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: production
          push: true
          provenance: false
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            BASE_DOMAIN=${{ env.BASE_DOMAIN }}
            API_HOST=${{ env.API_HOST }}
            API_PORT=${{ env.API_PORT }}
            WEB_HOST=${{ env.WEB_HOST }}
            WEB_PORT=${{ env.WEB_PORT }}

      - name: Extract metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: production
          push: true
          provenance: false
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          build-args: |
            DATABASE_URL=${{ env.DATABASE_URL }}

      - name: Lowercase image name for Postgres
        run: |
          echo "IMAGE_NAME_POSTGRES=$(echo ${{ env.IMAGE_BASE_NAME }}-postgres | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Postgres
        id: meta-postgres
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_POSTGRES }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push Postgres image
        uses: docker/build-push-action@v7
        with:
          context: ./infra/postgres
          push: true
          provenance: false
          tags: ${{ steps.meta-postgres.outputs.tags }}
          labels: ${{ steps.meta-postgres.outputs.labels }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Fetch secrets dynamically again for the deploy job
      - name: Fetch Infisical Secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID_PIPELINE }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET_PIPELINE }}
          env-slug: "prod"
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          domain: "https://eu.infisical.com"

      - name: Setup Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.SSH_PRIVATE_KEY }}" > ~/.ssh/ansible
          chmod 600 ~/.ssh/ansible

      - name: Lowercase image names for Ansible
        run: |
          echo "IMAGE_NAME_WEB=$(echo ${{ env.IMAGE_BASE_NAME }}-web | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_API=$(echo ${{ env.IMAGE_BASE_NAME }}-api | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_POSTGRES=$(echo ${{ env.IMAGE_BASE_NAME }}-postgres | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Run Ansible Deploy Playbook
        working-directory: infra/ansible
        run: |
          # Use the tag from the release or SHA as fallback
          IMAGE_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi

          ansible-playbook deploy.yml \
            -e "ghcr_username=${{ github.actor }}" \
            -e "ghcr_pat=${{ secrets.GITHUB_TOKEN }}" \
            -e "web_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:${IMAGE_TAG}" \
            -e "api_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${IMAGE_TAG}" \
            -e "postgres_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_POSTGRES }}:${IMAGE_TAG}" \
            --private-key ~/.ssh/ansible
