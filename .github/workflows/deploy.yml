name: Deploy to Production

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image names
        run: |
          echo "IMAGE_NAME_WEB=$(echo ${{ env.IMAGE_BASE_NAME }}-web | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_API=$(echo ${{ env.IMAGE_BASE_NAME }}-api | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Web
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.INF_NEXT_PUBLIC_API_URL }}
            BASE_DOMAIN=${{ secrets.INF_BASE_DOMAIN }}
            API_HOST=${{ secrets.INF_API_HOST }}
            API_PORT=${{ secrets.INF_API_PORT }}
            WEB_HOST=${{ secrets.INF_WEB_HOST }}
            WEB_PORT=${{ secrets.INF_WEB_PORT }}

      - name: Extract metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            DATABASE_URL=${{ secrets.INF_DATABASE_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.INF_SSH_PRIVATE_KEY }}" > ~/.ssh/ansible
          chmod 600 ~/.ssh/ansible

      - name: Lowercase image names for Ansible
        run: |
          echo "IMAGE_NAME_WEB=$(echo ${{ env.IMAGE_BASE_NAME }}-web | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_API=$(echo ${{ env.IMAGE_BASE_NAME }}-api | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Run Ansible Deploy Playbook
        working-directory: infra/ansible
        env:
          VPS_IP: ${{ secrets.INF_VPS_IP }}
          BASE_DOMAIN: ${{ secrets.INF_BASE_DOMAIN }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.INF_TRAEFIK_DASHBOARD_AUTH }}
          DB_USER: ${{ secrets.INF_DB_USER }}
          DB_PASSWORD: ${{ secrets.INF_DB_PASSWORD }}
          DB_NAME: ${{ secrets.INF_DB_NAME }}
          NEXT_PUBLIC_API_URL: ${{ secrets.INF_NEXT_PUBLIC_API_URL }}
          API_HOST: ${{ secrets.INF_API_HOST }}
          API_PORT: ${{ secrets.INF_API_PORT }}
          WEB_HOST: ${{ secrets.INF_WEB_HOST }}
          WEB_PORT: ${{ secrets.INF_WEB_PORT }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_CLIENT_ID_WEB: ${{ secrets.INFISICAL_CLIENT_ID_WEB }}
          INFISICAL_CLIENT_SECRET_WEB: ${{ secrets.INFISICAL_CLIENT_SECRET_WEB }}
          INFISICAL_CLIENT_ID_API: ${{ secrets.INFISICAL_CLIENT_ID_API }}
          INFISICAL_CLIENT_SECRET_API: ${{ secrets.INFISICAL_CLIENT_SECRET_API }}
        run: |
          # Récupération du SHA court pour le tag d'image
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

          ansible-playbook deploy.yml \
            -e "ghcr_username=${{ github.actor }}" \
            -e "ghcr_pat=${{ secrets.GITHUB_TOKEN }}" \
            -e "web_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}:sha-${SHORT_SHA}" \
            -e "api_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:sha-${SHORT_SHA}" \
            --private-key ~/.ssh/ansible
