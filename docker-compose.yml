services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gateway

  postgres:
    build: ./infra/postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: ${NODE_ENV}
      args:
        - NEXT_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST}
        - BASE_DOMAIN=${BASE_DOMAIN}
        - API_HOST=${API_HOST}
        - API_PORT=${API_PORT}
        - WEB_HOST=${WEB_HOST}
        - WEB_PORT=${WEB_PORT}
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - NEXT_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${BASE_DOMAIN}`)"
      - "traefik.http.services.web.loadbalancer.server.port=${WEB_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gateway

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: ${NODE_ENV}
    restart: always
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - API_PORT=${API_PORT}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${BASE_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=api-strip"
      - "traefik.http.services.api.loadbalancer.server.port=${API_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gateway
      - internal

networks:
  gateway:
    driver: bridge
  internal:
    driver: bridge

volumes:
  postgres_data:
