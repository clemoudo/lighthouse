services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/letsencrypt:/letsencrypt
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      # BasicAuth for dashboard: user:password (use htpasswd to generate)
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
      - "traefik.docker.network=gateway"
    networks:
      - proxy-only
      - gateway

  postgres:
    build: ./infra/postgres
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  web:
    container_name: web
    image: ${WEB_IMAGE:-lighthouse-web:latest}
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: ${NODE_ENV}
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - BASE_DOMAIN=${BASE_DOMAIN}
        - API_HOST=${API_HOST}
        - API_PORT=${API_PORT}
        - WEB_HOST=${WEB_HOST}
        - WEB_PORT=${WEB_PORT}
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - CI=true
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_API_URL=${INFISICAL_API_URL}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID_WEB}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET_WEB}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://web:${WEB_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${BASE_DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=${WEB_PORT}"
      - "traefik.docker.network=gateway"
      # Security Middlewares
      - "traefik.http.routers.web.middlewares=sec-headers"
      - "traefik.http.middlewares.sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.frameDeny=true"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gateway

  api:
    container_name: api
    image: ${API_IMAGE:-lighthouse-api:latest}
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: ${NODE_ENV}
      args:
        - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      - CI=true
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_API_URL=${INFISICAL_API_URL}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID_API}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET_API}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - document_storage:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://api:${API_PORT}/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${BASE_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=api-strip,sec-headers"
      - "traefik.http.services.api.loadbalancer.server.port=${API_PORT}"
      - "traefik.docker.network=gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gateway
      - backend

networks:
  proxy-only:
    name: proxy-only
    driver: bridge
  gateway:
    name: gateway
    driver: bridge
  backend:
    name: backend
    driver: bridge
    internal: true

volumes:
  postgres_data:
  document_storage:
