api:
  dashboard: true
  insecure: false

providers:
  docker:
    exposedByDefault: false
    network: gateway

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      httpChallenge:
        entryPoint: web
      email: "contact@clementvier.be"
      storage: /letsencrypt/acme.json

ping: {}
