---
- name: Créer les répertoires de l'application
  file:
    path: "/home/deploy/app/{{ item }}"
    state: directory
    owner: deploy
    group: deploy
    mode: '0755'
  loop:
    - infra/traefik
    - infra/postgres
    - infra/traefik/letsencrypt
    - apps/web
    - apps/api

- name: Copier le fichier docker-compose.yml
  copy:
    src: "{{ playbook_dir }}/../../docker-compose.yml"
    dest: /home/deploy/app/docker-compose.yml
    owner: deploy
    group: deploy
    mode: '0644'

- name: Copier les Dockerfiles (Requis pour que Docker Compose puisse parser le fichier)
  copy:
    src: "{{ playbook_dir }}/../../{{ item }}"
    dest: "/home/deploy/app/{{ item }}"
    owner: deploy
    group: deploy
    mode: '0644'
  loop:
    - apps/web/Dockerfile
    - apps/api/Dockerfile

- name: Copier la configuration Traefik
  copy:
    src: "{{ playbook_dir }}/../traefik/traefik.yml"
    dest: /home/deploy/app/infra/traefik/traefik.yml
    owner: deploy
    group: deploy
    mode: '0644'

- name: Copier les fichiers de base de données PostgreSQL
  copy:
    src: "{{ playbook_dir }}/../postgres/"
    dest: /home/deploy/app/infra/postgres/
    owner: deploy
    group: deploy
    mode: '0644'

- name: Générer le fichier .env de production
  template:
    src: env.j2
    dest: /home/deploy/app/.env
    owner: deploy
    group: deploy
    mode: '0600'

- name: Se connecter à GHCR
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_pat }}"

- name: Déployer l'application avec Docker Compose
  community.docker.docker_compose_v2:
    project_src: /home/deploy/app
    state: present
    pull: always
    remove_orphans: yes

- name: Appliquer les migrations Prisma (Sécurisé pour la production)
  community.docker.docker_container_exec:
    container: api
    command: npx prisma migrate deploy --schema=node_modules/@repo/db/prisma/schema.prisma
  register: migration_result
  failed_when: migration_result.rc != 0

